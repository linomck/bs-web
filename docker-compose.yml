networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  n2nd-data:

services:
  n2nd:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: n2nd
    restart: unless-stopped
    environment:
      - PORT=3000
      - CAPSOLVER_API_KEY=${CAPSOLVER_API_KEY}
      - BS_BASE_URL=${BS_BASE_URL:-https://burningseries.cx}
      - BS_FALLBACK_URL=${BS_FALLBACK_URL:-https://bs.to}
    volumes:
      - n2nd-data:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.n2nd.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.n2nd.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.n2nd.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.services.n2nd.loadbalancer.server.port=3000
      - traefik.http.routers.n2nd.middlewares=pocketid-auth
      - traefik.http.middlewares.pocketid-auth.plugin.traefik-oidc-auth.provider.url=${OIDC_PROVIDER_URL:-https://id.n2nd.de}
      - traefik.http.middlewares.pocketid-auth.plugin.traefik-oidc-auth.provider.clientId=${OIDC_CLIENT_ID}
      - traefik.http.middlewares.pocketid-auth.plugin.traefik-oidc-auth.provider.clientSecret=${OIDC_CLIENT_SECRET}
      - traefik.http.middlewares.pocketid-auth.plugin.traefik-oidc-auth.secret=${OIDC_COOKIE_SECRET}
      - traefik.http.middlewares.pocketid-auth.plugin.traefik-oidc-auth.scopes=openid,profile,email,groups
