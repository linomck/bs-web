networks:
  traefik:
    external: true
    name: ${TRAEFIK_NETWORK:-proxy}

volumes:
  bs-web-data:

services:
  bs-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: bs-web
    restart: unless-stopped
    environment:
      - PORT=3000
      - CAPSOLVER_API_KEY=${CAPSOLVER_API_KEY}
      - BS_BASE_URL=${BS_BASE_URL:-https://burningseries.cx}
      - BS_FALLBACK_URL=${BS_FALLBACK_URL:-https://bs.to}
    volumes:
      - bs-web-data:/app/data
    networks:
      - traefik
    labels:
      - traefik.enable=true
      - traefik.docker.network=${TRAEFIK_NETWORK:-proxy}
      - traefik.http.routers.bs-web.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.bs-web.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}
      - traefik.http.routers.bs-web.tls.certresolver=${TRAEFIK_CERTRESOLVER:-le}
      - traefik.http.services.bs-web.loadbalancer.server.port=3000
