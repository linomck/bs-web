<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N2nd - Katalog</title>
  <link rel="stylesheet" href="/theme.css">
  <link rel="stylesheet" href="/index.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <nav class="topnav">
    <span class="brand">N2nd</span>
    <div class="search-box">
      <span>🔍</span>
      <input type="text" id="search-input" placeholder="Serien durchsuchen...">
    </div>
  </nav>

  <section id="search-screen" class="search-screen hidden">
    <h2 class="row-title" id="search-title">Suche</h2>
    <div id="search-results" class="grid"></div>
  </section>

  <main id="home">
    <section id="hero" class="hero skeleton-block"></section>
    <section id="rows"></section>
  </main>

  <section class="all-section">
    <h2 class="row-title">Alle Serien</h2>
    <div id="genre-bar" class="genre-bar"></div>
    <div id="catalog-grid" class="grid">
      <div class="state-message"><span class="spinner"></span>Katalog wird geladen...</div>
    </div>
    <div id="pagination" class="pagination"></div>
  </section>

  <script src="/ext-status.js"></script>
  <script src="/index.js"></script>
</body>
</html>
